<!doctype html>
<html lang="en" class="cf-booking-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Your Cyberflight Studios booking request receipt.">
  <title>Request received · Cyberflight Studios</title>
  <link rel="icon" href="../../images/headers/logo_icon.png">
  <link rel="stylesheet" href="../../assets/css/fontawesome-all.min.css">
  <link rel="stylesheet" href="../../assets/css/site-shell.css?v=6">
  <link rel="stylesheet" href="../booking.css?v=40">
  <style>
    /* Centered confirmation card with the home button inside, top-right. */
    body.cf-booking .booking-layout { display: block; }
    body.cf-booking .confirm-panel {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      text-align: center;
      padding-top: 48px;
    }
    body.cf-booking .confirm-panel .confirm-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
    }
    body.cf-booking .confirm-panel .confirm-head .success-symbol { margin-bottom: 0; }
    body.cf-booking .confirm-panel .confirm-head .eyebrow {
      margin-bottom: 0;
      font-size: 1.25rem;
      letter-spacing: 0.18em;
    }
    body.cf-booking .confirm-panel .review-facts {
      margin-top: 22px;
      text-align: left;
    }
    body.cf-booking .confirm-panel .review-facts dt { text-align: left; }
    body.cf-booking .confirm-panel .review-facts dd { margin-top: 4px; }
  </style>
</head>
<body class="cf-booking">
  <main id="main">
        <div class="intro-tile-slot" data-include="/components/header.html?v=1" data-no-back></div>
    <div class="booking-layout">
      <div class="workspace">
        <section class="panel success confirm-panel">


          <div class="confirm-head">
            <div class="success-symbol" aria-hidden="true">✓</div>
            <p class="eyebrow">REQUEST RECEIVED</p>
          </div>
          <h2 id="confirmed-heading" tabindex="-1">We have your request.</h2>
          <p>I'll get back to you via email to confirm and follow up.</p>
        </section>
      </div>
    </div>
    <footer><span>CYBERFLIGHT STUDIOS</span><p><a href="/booking/">Back to booking <span aria-hidden="true">↗</span></a> · <a href="/contact/">Ask a general question <span aria-hidden="true">↗</span></a></p></footer>
  </main>
  <noscript><p class="noscript">JavaScript is only needed on the booking form itself; this page works without it.</p></noscript>
<script src="/components/html-include.js?v=5"></script>
</body>
<div class="booking-background" aria-hidden="true">
  <video autoplay muted loop playsinline poster="../../images/bg.webp">
    <source src="../../videos/homepage_background.mp4" type="video/mp4">
  </video>
</div>
</html>
