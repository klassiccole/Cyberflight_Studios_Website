<!doctype html>
<html lang="en" class="cf-booking-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Your message has been sent to Cyberflight Studios.">
		<!-- Open Graph / Twitter card metadata: what iMessage, Instagram,
			Slack, Discord, etc. show when this URL is pasted as a link.
			og:image uses favicon.png (512x512 PNG) site-wide per design decision
			(WebP is mishandled by some share platforms). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Cyberflight Studios" />
		<meta property="og:title" content="Message sent · Cyberflight Studios" />
		<meta property="og:description" content="Your message has been sent to Cyberflight Studios." />
		<meta property="og:image" content="https://cyberflight.studio/images/favicon.png" />
		<meta property="og:image:alt" content="Cyberflight Studios logo" />
		<meta name="twitter:card" content="summary_large_image" />
  <title>Message sent · Cyberflight Studios</title>
  <link rel="icon" href="../../images/headers/logo_icon.png">
  <link rel="stylesheet" href="../../assets/css/fontawesome-all.min.css">
  <link rel="stylesheet" href="../../assets/css/site-shell.css?v=6">
  <link rel="stylesheet" href="../../booking/booking.css?v=40">
  <style>
    /* Centered confirmation card with the home button inside, top-right. */
    body.cf-booking .booking-layout.contact-layout { display: block; }
    body.cf-booking .confirm-panel {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      text-align: center;
      padding-top: 48px;
    }
    body.cf-booking .confirm-panel .confirm-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
    }
    body.cf-booking .confirm-panel .confirm-head .success-symbol { margin-bottom: 0; }
    body.cf-booking .confirm-panel .confirm-head .eyebrow {
      margin-bottom: 0;
      font-size: 1.25rem;
      letter-spacing: 0.18em;
    }
  </style>
</head>
<body class="cf-booking">
  <main id="main">
        <div class="intro-tile-slot" data-include="/components/header.html?v=1" data-no-back></div>
    <div class="booking-layout contact-layout">
      <div class="workspace">
        <section class="panel success confirm-panel">


          <div class="confirm-head">
            <div class="success-symbol" aria-hidden="true">✓</div>
            <p class="eyebrow">MESSAGE SENT</p>
          </div>
          <p>Thanks for reaching out. I read every message personally and will reply by email, usually within a day or two.</p>
        </section>
      </div>
    </div>
    <footer><span>CYBERFLIGHT STUDIOS</span></footer>
  </main>
  <noscript><p class="noscript">This page is reached after you submit the contact form.</p></noscript>
<script src="/components/html-include.js?v=5"></script>
</body>
<div class="booking-background" aria-hidden="true">
  <video autoplay muted loop playsinline poster="../../images/bg.webp">
    <source src="../../videos/homepage_background.mp4" type="video/mp4">
  </video>
</div>
</html>
