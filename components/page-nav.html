	header banner on every page except the homepage. Populate pages by

	banner image:

	<script src="/components/html-include.js?v=2"></script>

	Current-page highlight: html-include.js marks the link matching the
	URL's first path segment with aria-current="page" and .is-active
	(filled white chip); see highlightPageNav() there and the .is-active
	rules in site-shell.css. Pages outside these four sections get no
	highlight.
-->
