<!--
	Shared nav-bar menu: the 4-button section menu (About / Gallery /
	Services / Booking) that forms the middle of every page's unified
	nav bar. The placeholder sits inside each page's .page-nav, between
	the back and home links:
		<nav class="page-nav">
			<a href="..." class="page-back">...</a>
			<div data-include="/components/page-nav.html?v=3"></div>
			<a href="/" class="page-home">...</a>
		</nav>

	Each link carries an icon AND a text label; site-shell.css shows the
	text on desktop and swaps to the icon on phones (the label goes
	visually-hidden there, so screen readers still announce it).

	Variants (read by html-include.js, which injects this fragment):
	- data-no-back on the placeholder hides the bar's back link (the
	  booking/contact confirmation pages).
	- data-back="/path/" on the placeholder overrides the back link's
	  destination (default: each page's own markup, one level up).

	Current-page highlight: html-include.js marks the link matching the
	URL's first path segment with aria-current="page" and .is-active
	(filled white chip); see highlightPageNav() there and the .is-active
	rules in site-shell.css. Pages outside these four sections get no
	highlight.
-->
<ul class="page-menu">
	<li><a href="/about/" aria-label="About">
		<i class="far fa-user" aria-hidden="true"></i>
		<span class="menu-label">About</span>
	</a></li>
	<li><a href="/gallery/" aria-label="Gallery">
		<i class="far fa-images" aria-hidden="true"></i>
		<span class="menu-label">Gallery</span>
	</a></li>
	<li><a href="/services/" aria-label="Services">
		<i class="fas fa-camera" aria-hidden="true"></i>
		<span class="menu-label">Services</span>
	</a></li>
	<li><a href="/booking/" aria-label="Booking">
		<i class="far fa-calendar-check" aria-hidden="true"></i>
		<span class="menu-label">Booking</span>
	</a></li>
</ul>
