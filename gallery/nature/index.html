<!DOCTYPE HTML>

<html lang="en">
	<head>
		<title>Nature Photography | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

		<!-- SEO -->
		<meta
			name="description"
			content="Explore nature photography by Cyberflight Studios."
		/>

		<link rel="icon" type="image/png" href="../../images/favicon.png" />

		<!-- Styles -->
		<link rel="stylesheet" href="../../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../../assets/css/main.css" />

		<noscript>
			<link rel="stylesheet" href="../../assets/css/noscript.css" />
		</noscript>
	</head>

	<body class="is-preload standalone-page">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Nature Photography -->
				<article id="gallery-nature">

					<h2 class="major">Nature Photography</h2>

					<div class="gallery-grid">

						<img src="../../images/gallery/nature/nature1.jpg" alt="Nature Photography 1" loading="lazy" decoding="async" />
						<img src="../../images/gallery/nature/nature2.jpg" alt="Nature Photography 2" loading="lazy" decoding="async" />
						<img src="../../images/gallery/nature/nature3.jpg" alt="Nature Photography 3" loading="lazy" decoding="async" />
						<img src="../../images/gallery/nature/nature4.jpg" alt="Nature Photography 4" loading="lazy" decoding="async" />
						<img src="../../images/gallery/nature/nature5.jpg" alt="Nature Photography 5" loading="lazy" decoding="async" />
						<img src="../../images/gallery/nature/nature6.jpg" alt="Nature Photography 6" loading="lazy" decoding="async" />

					</div>

					<!-- Back to Gallery -->
					<a href="../" class="page-back" aria-label="Back to gallery" title="Back to Gallery">
						&#8592;
					</a>

				</article>

			</div>

			<footer id="footer"></footer>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../videos/homepage_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>

		</div>
<!-- Site JavaScript -->
<script src="../../assets/js/main.js"></script>

	</body>
</html>
