<html lang="en">
	<head>
		<title>35mm Film Photography | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

		<!-- SEO -->
		<meta
			name="description"
			content="Explore 35mm film photography by Cyberflight Studios."
		/>

		<link rel="icon" type="image/png" href="../../../images/favicon.png" />

		<!-- Styles -->
		<link rel="stylesheet" href="../../../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../../../assets/css/site-shell.css" />
		<link rel="stylesheet" href="../../../assets/css/site-pages.css" />
		<noscript>
			<link rel="stylesheet" href="../../../assets/css/noscript.css" />
		</noscript>
	</head>

	<body class="is-preload standalone-page">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Film Photography -->
				<article id="gallery-film">

					<h2 class="major">35MM Film Photography</h2>

					<div class="gallery-grid">

						<img src="../../images/gallery/film/film1.jpg" alt="35mm Film Photography 1" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film2.jpg" alt="35mm Film Photography 2" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film3.jpg" alt="35mm Film Photography 3" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film4.jpg" alt="35mm Film Photography 4" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film5.jpg" alt="35mm Film Photography 5" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film6.jpg" alt="35mm Film Photography 6" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film7.jpg" alt="35mm Film Photography 7" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film8.jpg" alt="35mm Film Photography 8" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film9.jpg" alt="35mm Film Photography 9" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film10.jpg" alt="35mm Film Photography 10" loading="lazy" decoding="async" />
						<img src="../../images/gallery/film/film11.jpg" alt="35mm Film Photography 11" loading="lazy" decoding="async" />

					</div>

					<!-- Back to Gallery -->
					<a href="../" class="page-back" aria-label="Back to gallery" title="Back to Gallery">
						&#8592;
					</a>

				</article>

			</div>

			<footer id="footer"></footer>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../videos/homepage_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>
		</div>

	<!-- Site JavaScript -->
		<script src="../../assets/js/main.js"></script>

	</body>
</html>
