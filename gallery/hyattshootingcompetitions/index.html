	<body class="standalone-page floating-boxes">

		<!-- Wrapper -->

				<!-- Hyatt Shooting Competitions -->
				<article id="gallery-hyatt">

					<div class="intro-tile-slot" data-include="/components/header.html?v=1"></div>

					<h2 class="major">Hyatt Shooting Competitions</h2>

					<div class="gallery-grid">

						<img src="../../images/gallery/hyattshootingcompetitions/hyatt1.jpg" alt="Hyatt Shooting Competition 1" loading="lazy" decoding="async" />
						<img src="../../images/gallery/hyattshootingcompetitions/hyatt2.jpg" alt="Hyatt Shooting Competition 2" loading="lazy" decoding="async" />
						<img src="../../images/gallery/hyattshootingcompetitions/hyatt3.jpg" alt="Hyatt Shooting Competition 3" loading="lazy" decoding="async" />

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../videos/gallery_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>
