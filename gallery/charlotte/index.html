<!DOCTYPE HTML>

<html lang="en">
	<head>
		<title>Charlotte Photography | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<link rel="canonical" href="https://cyberflight.studio/gallery/charlotte/" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

		<!-- SEO -->
		<meta
			name="description"
			content="Explore Charlotte, North Carolina photography by Cyberflight Studios."
		/>

		<link rel="icon" type="image/png" href="../../images/favicon.png" />

		<!-- Styles -->
		<link rel="stylesheet" href="../../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../../assets/css/site-shell.css?v=5" />
		<link rel="stylesheet" href="../../assets/css/site-pages.css?v=4" />
	</head>

	<body class="standalone-page floating-boxes">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Charlotte Photography -->
				<article id="gallery-charlotte">

					<!-- Gallery Header -->
					<div class="intro-tile">
						<!-- Brand: links home; sits above the nav bar -->
						<a class="page-brand" href="/">
							<img src="/images/headers/logo_icon.png" alt="Cyberflight Studios" />
							<span>Cyberflight Studios</span>
						</a>

						<nav class="page-nav" aria-label="Page navigation">
							<a
								href="../"
								class="page-back"
								aria-label="Back to gallery"
								title="Back to Gallery"
							>
								&#8592;
							</a>
							<div data-include="/components/page-nav.html?v=3"></div>
							<a
								href="/"
								class="page-home icon solid fa-home"
								aria-label="Home"
								title="Home"
							></a>
						</nav>

					</div>

					<h2 class="major">Charlotte - North Carolina</h2>

					<div class="gallery-grid">

						<img
							src="../../images/gallery/charlotte/charlotte1.jpg"
							alt="Charlotte, North Carolina 1"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../images/gallery/charlotte/charlotte2.jpg"
							alt="Charlotte, North Carolina 2"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../images/gallery/charlotte/charlotte3.jpg"
							alt="Charlotte, North Carolina 3"
							loading="lazy"
							decoding="async"
						/>

					</div>

				</article>

			</div>
			<div data-include="/components/footer.html?v=2"></div>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../videos/gallery_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>

		</div>

<!-- Site JavaScript -->
	<script src="../../assets/js/main.js?v=2"></script>

	<script src="/components/html-include.js?v=4"></script>
	</body>
</html>
