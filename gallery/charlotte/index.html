<html>
	<head>
		<title>Charlotte Photography | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

		<!-- SEO -->
		<meta
			name="description"
			content="Explore Charlotte, North Carolina photography by Cyberflight Studios."
		/>

		<link rel="icon" type="image/png" href="../../images/favicon.png" />

		<!-- Styles -->
		<link rel="stylesheet" href="../../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../../assets/css/main.css" />

		<noscript>
			<link rel="stylesheet" href="../../assets/css/noscript.css" />
		</noscript>
	</head>

	<body class="is-preload standalone-page">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Charlotte Photography -->
				<article id="gallery-charlotte">

					<h2 class="major">Charlotte - North Carolina</h2>

					<div class="gallery-grid">

						<img
							src="../../images/gallery/charlotte/charlotte1.jpg"
							alt="Charlotte, North Carolina 1"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../images/gallery/charlotte/charlotte2.jpg"
							alt="Charlotte, North Carolina 2"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../images/gallery/charlotte/charlotte3.jpg"
							alt="Charlotte, North Carolina 3"
							loading="lazy"
							decoding="async"
						/>

					</div>

					<!-- Back to Gallery -->
					<a href="../" class="page-back" aria-label="Back to gallery" title="Back to Gallery">
						&#8592;
					</a>

				</article>

			</div>

			<footer id="footer"></footer>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../videos/homepage_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>

		</div>

		<!-- Scripts -->
		<script src="../../assets/js/jquery.min.js"></script>
		<script src="../../assets/js/browser.min.js"></script>
		<script src="../../assets/js/breakpoints.min.js"></script>
		<script src="../../assets/js/util.js"></script>

		<script>
			// Remove preload styling once the page is ready.
			window.addEventListener("DOMContentLoaded", function () {
				document.body.classList.remove("is-preload");
			});
		</script>

	</body>
</html>
