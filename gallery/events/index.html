<!DOCTYPE HTML>

	html5up.net | @ajlkn

<html lang="en">
	<head>
		<title>Event Photography | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no"
		/>

		<!-- SEO -->
		<meta
			name="description"
			content="Explore event photography from Cyberflight Studios, including local events, competitions, automotive gatherings, and airshows."
		/>

		<link rel="icon" type="image/png" href="../../images/favicon.png" />

		<!-- Styles -->
		<link rel="stylesheet" href="../../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../../assets/css/site-shell.css" />
		<link rel="stylesheet" href="../../assets/css/site-pages.css" />
		<noscript>
			<link rel="stylesheet" href="../../assets/css/noscript.css" />
		</noscript>
	</head>

	<body class="is-preload standalone-page">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Events Gallery -->
				<article id="gallery-events">

					<!-- Gallery Header -->
					<span class="image page-banner">
						<img
							src="../../images/headers/gallery.webp"
							alt="Cyberflight Studios Event Photography"
						/>
					</span>

					<div class="gallery-grid">

						<a
							href="cyclegearbikenights/"
							class="gallery-item"
						>
							<img
								src="../../images/gallery/events/cyclegearbikenight/cyclegear_cover.webp"
								alt="Cycle Gear Bike Nights"
							/>
							<h3>Cycle Gear Bike Nights</h3>
						</a>

						<a
							href="hyattshootingcompetitions/"
							class="gallery-item"
						>
							<img
								src="../../images/gallery/events/hyattshootingcompetitions/hyatt_cover.webp"
								alt="Hyatt Shooting Competitions"
							/>
							<h3>Hyatt Shooting Competitions</h3>
						</a>

						<a
							href="monroeairshow/"
							class="gallery-item"
						>
							<img
								src="../../images/gallery/events/monroeairshow/monroeairshow_cover.webp"
								alt="Monroe Airshow"
							/>
							<h3>Monroe Airshow</h3>
						</a>

					</div>

					<!-- Back to Gallery -->
					<a
						href="../"
						class="page-back"
						aria-label="Back to gallery"
						title="Back to Gallery"
					>
						&#8592;
					</a>

				</article>

			</div>

			<footer id="footer"></footer>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../videos/homepage_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>

		</div>

	<!-- Site JavaScript -->
		<script src="../../assets/js/main.js"></script>
	</body>
</html>
