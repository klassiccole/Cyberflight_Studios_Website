<!DOCTYPE HTML>

<html lang="en">
	<head>
		<title>Cycle Gear Bike Nights | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no"
		/>

		<!-- SEO -->
		<meta
			name="description"
			content="Photography from Cycle Gear Bike Nights by Cyberflight Studios in the Charlotte, NC area."
		/>

		<link rel="icon" type="image/png" href="../../../images/favicon.png" />

		<!-- Styles -->
		<link rel="stylesheet" href="../../../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../../../assets/css/main.css" />

		<noscript>
			<link rel="stylesheet" href="../../../assets/css/noscript.css" />
		</noscript>
	</head>

	<body class="is-preload standalone-page">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Cycle Gear Bike Nights -->
				<article id="gallery-cyclegear">

					<h2 class="major">Cycle Gear Bike Nights</h2>

					<div class="gallery-grid">

						<img
							src="../../../images/gallery/events/cyclegearbikenight/cyclegear1.jpg"
							alt="Cycle Gear Bike Night 1"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../../images/gallery/events/cyclegearbikenight/cyclegear2.jpg"
							alt="Cycle Gear Bike Night 2"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../../images/gallery/events/cyclegearbikenight/cyclegear3.jpg"
							alt="Cycle Gear Bike Night 3"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../../images/gallery/events/cyclegearbikenight/cyclegear4.jpg"
							alt="Cycle Gear Bike Night 4"
							loading="lazy"
							decoding="async"
						/>

						<img
							src="../../../images/gallery/events/cyclegearbikenight/cyclegear5.jpg"
							alt="Cycle Gear Bike Night 5"
							loading="lazy"
							decoding="async"
						/>

					</div>

					<!-- Back to Events -->
					<a
						href="../"
						class="page-back"
						aria-label="Back to events"
						title="Back to Events"
					>
						&#8592;
					</a>

				</article>

			</div>

			<footer id="footer"></footer>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../../videos/homepage_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>
			
		</div>
	<!-- Site JavaScript -->
		<script src="../../../assets/js/main.js"></script>

	</body>
</html>
