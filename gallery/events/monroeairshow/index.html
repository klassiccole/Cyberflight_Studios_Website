<html>
	<head>
		<title>Monroe Airshow | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no"
		/>

		<!-- SEO -->
		<meta
			name="description"
			content="Airshow photography from the Monroe Airshow by Cyberflight Studios in North Carolina."
		/>

		<link rel="icon" type="image/png" href="../../../images/favicon.png" />

		<!-- Styles -->
		<link rel="stylesheet" href="../../../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../../../assets/css/main.css" />

		<noscript>
			<link rel="stylesheet" href="../../../assets/css/noscript.css" />
		</noscript>
	</head>

	<body class="is-preload standalone-page">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Monroe Airshow -->
				<article id="gallery-monroe-airshow">

					<h2 class="major">Monroe Airshow</h2>

					<div class="gallery-grid">

						<img src="../../../images/gallery/events/monroeairshow/monroeairshow1.jpg" alt="Monroe Airshow 1" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow2.jpg" alt="Monroe Airshow 2" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow3.jpg" alt="Monroe Airshow 3" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow4.jpg" alt="Monroe Airshow 4" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow5.jpg" alt="Monroe Airshow 5" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow6.jpg" alt="Monroe Airshow 6" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow7.jpg" alt="Monroe Airshow 7" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow8.jpg" alt="Monroe Airshow 8" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow9.jpg" alt="Monroe Airshow 9" loading="lazy" decoding="async" />
						<img src="../../../images/gallery/events/monroeairshow/monroeairshow10.jpg" alt="Monroe Airshow 10" loading="lazy" decoding="async" />

					</div>

					<!-- Back to Events -->
					<a
						href="../"
						class="page-back"
						aria-label="Back to events"
						title="Back to Events"
					>
						&#8592;
					</a>

				</article>

			</div>

			<footer id="footer"></footer>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../../../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../../../videos/homepage_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>

		</div>
<!-- Page Initialization -->
		<script>
			window.addEventListener("DOMContentLoaded", function () {
				document.body.classList.remove("is-preload");
			});
		</script>

	</body>
</html>
