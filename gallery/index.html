<html lang="en">
	<head>
		<title>Gallery | Cyberflight Studios</title>

		<meta charset="utf-8" />
		<link rel="canonical" href="https://cyberflight.studio/gallery/" />
		<!-- Open Graph / Twitter card metadata: what iMessage, Instagram,
			Slack, Discord, etc. show when this URL is pasted as a link.
			og:image uses favicon.png (512x512 PNG) site-wide per design decision
			(WebP is mishandled by some share platforms). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Cyberflight Studios" />
		<meta property="og:title" content="Gallery | Cyberflight Studios" />
		<meta property="og:description" content="Explore photography and visual media from Cyberflight Studios, including events, Charlotte, nature, and film photography." />
		<meta property="og:url" content="https://cyberflight.studio/gallery/" />
		<meta property="og:image" content="https://cyberflight.studio/images/favicon.png" />
		<meta property="og:image:alt" content="Cyberflight Studios logo" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no"
		/>

		<!-- SEO -->
		<meta
			name="description"
			content="Explore photography and visual media from Cyberflight Studios, including events, Charlotte, nature, and film photography."
		/>

		<link rel="icon" type="image/png" href="../images/favicon.png" />
		<link rel="stylesheet" href="../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../assets/css/site-shell.css?v=6" />
		<link rel="stylesheet" href="../assets/css/site-pages.css?v=5" />
	</head>

	<body class="standalone-page floating-boxes">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">

				<!-- Gallery -->
				<article id="gallery">

					<div class="intro-tile-slot" data-include="/components/header.html?v=1"></div>

					<div class="gallery-grid">

						<a href="charlotte/" class="gallery-item">
							<img
								src="../images/gallery/charlotte/charlotte_cover.webp"
								alt="Charlotte"
							/>
							<h3>Charlotte</h3>
						</a>

						<a href="cyclegearbikenights/" class="gallery-item">
							<img
								src="../images/gallery/cyclegearbikenights/cyclegear_cover.webp"
								alt="Cycle Gear Bike Nights"
							/>
							<h3>Cycle Gear Bike Nights</h3>
						</a>

						<a href="film/" class="gallery-item">
							<img
								src="../images/gallery/film/film_cover.webp"
								alt="Film Photography"
							/>
							<h3>Film</h3>
						</a>

						<a href="hyattshootingcompetitions/" class="gallery-item">
							<img
								src="../images/gallery/hyattshootingcompetitions/hyatt_cover.webp"
								alt="Hyatt Shooting Competitions"
							/>
							<h3>Hyatt Shooting Competitions</h3>
						</a>

						<a href="monroeairshow/" class="gallery-item">
							<img
								src="../images/gallery/monroeairshow/monroeairshow_cover.webp"
								alt="Monroe Airshow"
							/>
							<h3>Monroe Airshow</h3>
						</a>

						<a href="nature/" class="gallery-item">
							<img
								src="../images/gallery/nature/nature_cover.webp"
								alt="Nature Photography"
							/>
							<h3>Nature</h3>
						</a>

					</div>
				</article>

			</div>

			<div data-include="/components/footer.html?v=2"></div>

		</div>

		<!-- Background -->
		<div id="bg">

			<video
				id="homepage-video"
				muted
				loop
				playsinline
				preload="none"
				poster="../images/bg.webp"
				aria-hidden="true">
			</video>

			<script>
				window.addEventListener("load", function () {

					const video = document.getElementById("homepage-video");

					const source = document.createElement("source");
					source.src = "../videos/gallery_background.mp4";
					source.type = "video/mp4";

					video.appendChild(source);
					video.load();

					video.addEventListener("canplay", function () {
						video.play().catch(function () {
							// Poster remains visible if autoplay is unavailable.
						});
					}, { once: true });

				});
			</script>

		</div>

	<!-- Site JavaScript -->
		<script src="../assets/js/main.js?v=2"></script>

	<script src="/components/html-include.js?v=5"></script>

	</body>
</html>
