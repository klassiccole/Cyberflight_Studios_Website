<html lang="en">
	<head>
		<title>Cyberflight Studios</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Cyberflight Studios provides drone media, photography, and videography services in Charlotte, NC, specializing in dynamic visuals built around movement, perspective, and adrenaline." />
		<link rel="icon" type="image/png" href="images/favicon.png" />
		<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="assets/css/site-shell.css" />
		<link rel="stylesheet" href="assets/css/homepage.css" />
		<noscript>
			<link rel="stylesheet" href="assets/css/noscript.css" />
		</noscript>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header">
						<div class="logo">
  						<img src="images/logo.webp" alt="Cyberflight Studios Logo" fetchpriority="high">
						</div>
						<div class="content">
							<div class="inner">
								<h1>Cyberflight Studios</h1>
								<p class="location">Based in Charlotte, NC</p>
								<p>Drone media, photography, and videography built around  <br />
								movement, perspective, and adrenaline. <strong> Make Your Ideas Move.</strong></p>
							</div>
						</div>
						<nav>
							<ul>
								<li><a href="about/">About</a></li>
								<li><a href="gallery/">Gallery</a></li>
								<li><a href="services/">Services</a></li>
								<li><a href="contact/">Contact</a></li>
							</ul>
						</nav>
						<ul class="home-socials">
							<li>
								<a href="https://www.instagram.com/cyberflightstudios/"
								class="icon brands fa-instagram"
								target="_blank"
								rel="noopener noreferrer"
								aria-label="Cyberflight Studios on Instagram">
									<span class="label">Instagram</span>
								</a>
							</li>

							<li>
								<a href="https://www.tiktok.com/@cyberflightstudios"
								class="icon brands fa-tiktok"
								target="_blank"
								rel="noopener noreferrer"
								aria-label="Cyberflight Studios on TikTok">
									<span class="label">TikTok</span>
								</a>
							</li>

							<li>
								<a href="https://www.youtube.com/@cyberflightstudios"
								class="icon brands fa-youtube"
								target="_blank"
								rel="noopener noreferrer"
								aria-label="Cyberflight Studios on YouTube">
									<span class="label">YouTube</span>
								</a>
							</li>
						</ul>
					</header>
					
				<!-- Footer -->
					<footer id="footer">
  						<!-- You can always add something to the end right here! -->
				</footer>
			</div>

		<!-- Background -->
			<div id="bg">
				<video
					id="homepage-video"
					muted
					loop
					playsinline
					preload="none"
					poster="images/bg.webp"
					aria-hidden="true">
				</video>
				<script>
					window.addEventListener("load", function () {
						const video = document.getElementById("homepage-video");

						const source = document.createElement("source");
						source.src = "videos/homepage_background.mp4";
						source.type = "video/mp4";

						video.appendChild(source);
						video.load();

						video.addEventListener("canplay", function () {
							video.play().catch(function () {
								// Poster remains visible if autoplay is unavailable.
							});
						}, { once: true });
					});
				</script>
			</div>

		<!-- Scripts -->
			<script src="assets/js/main.js"></script>
	</body>
</html>
